<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Faro Portal nội bộ</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Bản demo Portal nội bộ Faro, dữ liệu mẫu">
<meta name="theme-color" content="#2E2926">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Faro Portal">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Bitter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F7F5F0; --surface:#FFFEFB; --surface-2:#F2EEE3; --surface-3:#EBE5D6;
  --ink:#2E2926; --ink-2:#5A514A; --muted:#8A8076; --line:#E8E2D4;
  --accent:#2E2926; --accent-hover:#46403B; --on-accent:#F8F0D2; --accent-soft:#F8F0D2; --accent-ink:#2E2926;
  --amber:#6E5512; --amber-soft:#FCEFC2; --stamp:#83572E;
  --danger:#A3412F; --danger-soft:#F6E1DA; --ok:#4E6B30; --ok-soft:#E7F1DA; --info:#2F6280; --info-soft:#E4F2FA;
  --frame:#2E2926; --shadow:0 1px 2px rgba(46,41,38,.06),0 8px 28px rgba(46,41,38,.08);
  --side:#F8F0D2; --side-line:#EADFB8; --side-muted:#8C7F66; --side-hover:#F1E5BD; --side-active:#F7D464; --chart:#83572E;
  --cream:#F8F0D2; --sky:#A5D8F0; --leaf:#B4D78C; --gold:#F7D464; --bean:#2E2926; --bark:#83572E;
  --display:"Bitter",Georgia,serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --label:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1A1715; --surface:#24201D; --surface-2:#2B2623; --surface-3:#342E2A;
  --ink:#F8F0D2; --ink-2:#D8CDB4; --muted:#A39887; --line:#3B342F;
  --accent:#F7D464; --accent-hover:#F9DE85; --on-accent:#2E2926; --accent-soft:#3A3322; --accent-ink:#F7D464;
  --amber:#F0C75A; --amber-soft:#3A3018; --stamp:#D6A56E;
  --danger:#EE8E7C; --danger-soft:#3E231D; --ok:#B4D78C; --ok-soft:#27301C; --info:#A5D8F0; --info-soft:#1E2F3A;
  --frame:#000; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --side:#211D1A; --side-line:#3B342F; --side-muted:#A39887; --side-hover:#2B2623; --side-active:#3A3322; --chart:#D6A56E;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1A1715; --surface:#24201D; --surface-2:#2B2623; --surface-3:#342E2A;
  --ink:#F8F0D2; --ink-2:#D8CDB4; --muted:#A39887; --line:#3B342F;
  --accent:#F7D464; --accent-hover:#F9DE85; --on-accent:#2E2926; --accent-soft:#3A3322; --accent-ink:#F7D464;
  --amber:#F0C75A; --amber-soft:#3A3018; --stamp:#D6A56E;
  --danger:#EE8E7C; --danger-soft:#3E231D; --ok:#B4D78C; --ok-soft:#27301C; --info:#A5D8F0; --info-soft:#1E2F3A;
  --frame:#000; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  --side:#211D1A; --side-line:#3B342F; --side-muted:#A39887; --side-hover:#2B2623; --side-active:#3A3322; --chart:#D6A56E;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{height:38px;padding:0 12px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;font-size:16px}
.wm{display:block;height:1em;width:auto}
.lockup{display:block;width:100%;height:auto}
.brand b{font-family:var(--display);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.who select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--ink);max-width:260px}

.stage{padding-inline:16px;padding-block:24px 40px}

/* ===== employee mode ===== */
.emp{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:230px 410px minmax(0,1fr);gap:32px;align-items:start}
.guide{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.guide h4{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.guide a{display:block;padding:5px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-size:13px;cursor:pointer}
.guide a:hover{background:var(--surface)}
.guide a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.phone{width:410px;height:min(860px,calc(100vh - 120px));min-height:640px;background:var(--frame);border-radius:46px;padding:10px;box-shadow:var(--shadow);position:sticky;top:84px}
.ph{height:100%;background:var(--bg);border-radius:37px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph-status{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;background:var(--surface)}
.ph-head{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line);min-height:52px}
.ph-head h2{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--ink);position:relative}
.iconbtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 24px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.scr > *{flex-shrink:0}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:8px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.spec{position:sticky;top:84px;max-width:440px;display:flex;flex-direction:column;gap:14px}
.spec .card{padding:18px 20px}
.spec h3{font-size:20px}
.spec .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.spec ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.spec .persona{display:flex;gap:12px;align-items:center}

/* shared pieces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-t h3{font-size:16px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.li:first-child{border-top:0}
button.li:hover{background:var(--surface-2)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:12px;color:var(--muted)}
.chev{color:var(--muted)}
.tile-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
textarea.inp{resize:vertical;min-height:76px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-3);color:var(--ink-2);font-size:12.5px;align-items:flex-start}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.note .ic{margin-top:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:500}
.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty .ic{margin:0 auto 10px;color:var(--muted)}

/* home */
.hello h2{font-size:24px}
.task{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.task:hover{border-color:var(--accent)}
.task .t{font-weight:600;line-height:1.3}
.task .s{font-size:12px;color:var(--muted)}
.celebrate{border-radius:16px;padding:16px;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.celebrate h3{font-size:19px}
.celebrate .bonus{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;font-size:12.5px}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.celebrate > *:not(canvas){position:relative}

/* payslip */
.slip{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.slip::after{content:attr(data-wm);position:absolute;inset:-40% -40%;display:flex;align-items:center;justify-content:center;transform:rotate(-24deg);font-size:13px;font-weight:700;color:var(--ink);opacity:.05;letter-spacing:.1em;white-space:pre;line-height:3.2;pointer-events:none}
.slip table{width:100%;border-collapse:collapse;font-size:13.5px}
.slip td{padding:8px 0;border-top:1px dashed var(--line);vertical-align:top}
.slip td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.slip .grp td{border-top:0;padding-top:14px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.slip .net td{border-top:2px solid var(--ink);font-weight:700;font-size:16px;padding-top:10px}
.neg{color:var(--danger)}

/* learning */
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stamp{border:1.5px dashed var(--line);border-radius:12px;background:var(--surface);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;font-weight:600;min-height:112px;position:relative}
.stamp .cup{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted)}
.stamp.done{border-style:solid;border-color:var(--stamp)}
.stamp.done .cup{background:none;border:2px solid var(--stamp);color:var(--stamp);transform:rotate(-12deg)}
.stamp .d{font-size:10px;color:var(--muted);font-weight:500}
.stamp .new{position:absolute;top:6px;right:6px}
.recipes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);text-align:left;padding:0}
.rcard .img{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:rgba(255,255,255,.9)}
.rcard .cap{padding:8px 10px;font-weight:600;font-size:13px}
.rcard .cap small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.ladder{display:flex;flex-direction:column;gap:0}
.rung{display:grid;grid-template-columns:28px 1fr;gap:12px}
.rung .rail{display:flex;flex-direction:column;align-items:center}
.rung .node{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;background:var(--surface-3);color:var(--muted);border:2px solid var(--line)}
.rung .node.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rung .line{flex:1;width:2px;background:var(--line);min-height:16px}
.rung .body{padding-bottom:16px}
.cls{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .n{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted);text-align:center}
.rank.top .n{color:var(--stamp)}
.rank.me{background:var(--accent-soft)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.podium div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.podium b{font-size:12.5px;line-height:1.25}
.podium .p1{padding-top:18px;border-color:var(--stamp)}

/* community */
.post{padding:14px;display:flex;flex-direction:column;gap:10px}
.post .body{font-size:14px}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.react{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.react[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.badge-k{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--stamp);color:var(--stamp);font-weight:700;font-size:12px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-weight:700}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* tickets */
.steps{display:flex;gap:4px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.steps span.on{background:var(--accent)}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:13.5px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px;font-weight:600}

/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(46,41,38,.45);z-index:30;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 4px}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:2px;color:var(--line)}
.stars button.on{color:var(--stamp)}
.stars svg{fill:currentColor}

/* login */
.login{flex:1;display:flex;flex-direction:column;padding:32px 24px;gap:18px;background:var(--surface);overflow:auto}
.login .mark{color:var(--accent);max-width:220px}

/* ===== admin ===== */
.adm{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.side button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.side button:hover{background:var(--surface-2)}
.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.side .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:0 7px}
.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 10px 4px;border-top:1px solid var(--line);margin-top:6px}
.cash-wrap{max-height:560px;overflow:auto}
.cash thead th{position:sticky;top:0;background:var(--surface);z-index:1}
.cash td{font-size:13px}
.tbl td.amt-miss{background:var(--danger-soft);color:var(--danger);font-weight:700}
.drawer-bg{position:fixed;inset:0;background:rgba(46,41,38,.45);z-index:45;display:flex;justify-content:flex-end}
.drawer{width:min(480px,100%);height:100%;background:var(--surface);overflow-y:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.wizn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:700;font-size:12px;flex:none;color:var(--muted)}
.wizn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.vbars .target{position:absolute;left:0;right:0;border-top:2px dashed var(--amber);pointer-events:none}
.vbars .target span{position:absolute;right:0;top:-20px;font-size:11px;color:var(--amber);font-weight:700;background:var(--surface);padding:0 4px}
.side .role-note{font-size:11.5px;color:var(--muted);padding:10px 10px 4px;border-top:1px solid var(--line);margin-top:6px}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.ahead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.ahead h1{font-size:28px}
.ahead p{margin:4px 0 0;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px}
button.kpi:hover{border-color:var(--accent)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted)}
.todo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.todo button{background:var(--surface);border:0;text-align:left;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.todo button:hover{background:var(--surface-2)}
.todo .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;min-width:34px;font-variant-numeric:tabular-nums}
.todo .t{font-weight:600;line-height:1.3}
.todo .s{font-size:12px;color:var(--muted)}
.sev{width:4px;align-self:stretch;border-radius:2px;flex:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-size:17px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.err td{background:var(--danger-soft)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:150px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.hb .track{height:18px;position:relative}
.hb .fill{position:absolute;left:0;top:0;bottom:0;background:var(--chart);border-radius:0 4px 4px 0}
.hb:hover .fill{background:var(--accent-hover)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.vbars{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;height:180px;border-bottom:1px solid var(--line);position:relative}
.vbars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12px}
.vbars .col-b{width:60%;max-width:46px;background:var(--chart);border-radius:4px 4px 0 0}
.vbars .b:hover .col-b{background:var(--accent-hover)}
.vbars .b.last .col-b{background:var(--accent)}
.vx{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.wiz{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.wiz button{flex:1;border:0;background:none;padding:12px 14px;text-align:left;border-left:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.wiz button:first-child{border-left:0}
.wiz .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-weight:700;font-size:12px;flex:none}
.wiz button.done{color:var(--ok)}
.wiz button[aria-current="step"]{color:var(--ink);background:var(--accent-soft);font-weight:600}
.wiz button[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.map-row{display:grid;grid-template-columns:1fr 24px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.map-row select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;width:100%}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.tick{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.bdg{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:0}
.tl .it{display:grid;grid-template-columns:14px 1fr;gap:12px;padding-bottom:14px;position:relative}
.tl .it::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl .it:last-child::before{display:none}
.tl .dotc{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:3px}

@media (max-width:1180px){
  .emp{grid-template-columns:410px minmax(0,1fr)}
  .guide{display:none}
}
@media (max-width:900px){
  .adm{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;overflow-x:auto;padding:6px}
  .side button{white-space:nowrap}
  .side .role-note,.side .grp{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2,.split{grid-template-columns:1fr}
  .todo{grid-template-columns:1fr}
  .hb{grid-template-columns:110px 1fr 40px}
  .wiz{flex-direction:column}
  .wiz button{border-left:0;border-top:1px solid var(--line)}
  .wiz button:first-child{border-top:0}
}
@media (max-width:760px){
  .emp{grid-template-columns:1fr;gap:18px}
  .stage:has(> .emp){padding:0}
  .phone{width:100%;max-width:none;margin:0;position:relative;top:0;height:calc(100dvh - var(--toph,64px));min-height:480px;border-radius:0;padding:0;box-shadow:none;background:none}
  .ph{border-radius:0}
  .ph-status{display:none}
  .spec{position:static;max-width:none;padding:0 16px 32px}
  .top-in{gap:8px;min-height:52px;padding-block:6px}
  .brand>div:last-child{display:none}
  .who label{display:none}
  .who select{max-width:44vw}
  .seg button{padding:6px 9px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
[hidden]{display:none!important}
.gate{min-height:calc(100vh - 140px);display:grid;place-items:center}
.gate-card{width:min(940px,100%);display:grid;grid-template-columns:1fr 1.1fr;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.gate-side{background:var(--accent);color:var(--on-accent);padding:36px 32px;display:flex;flex-direction:column;gap:22px}
.gate-logo{max-width:210px}.gate-logo svg{width:100%;height:auto;display:block}
.gate-side h2{font-family:var(--display);font-size:28px;margin:0 0 6px}.gate-side p{margin:0;opacity:.9;line-height:1.5}
.gate-side ul{list-style:none;margin:auto 0 0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px}.gate-side li{display:flex;gap:10px;align-items:center;opacity:.95}
.gate-form{padding:36px 32px;display:flex;flex-direction:column;gap:14px}.gate-form h1{font-family:var(--display);font-size:30px;margin:0}.gate-form p{margin:4px 0 0}
.gate-demo{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.gate-acc{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;color:var(--ink)}
.gate-acc:hover,.gate-acc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gate-acc>span:not(.av){display:flex;flex-direction:column}.gate-acc b{font-size:13px}.gate-acc small{font-size:12px;color:var(--muted)}
@media (max-width:760px){.gate-card{grid-template-columns:1fr}.gate-side{padding:24px 20px;gap:14px}.gate-side ul{display:none}.gate-form{padding:24px 20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function header(k){
  const s=SCR[k]; const canBack=S.stack.length>0 && !s.hub && k!=='home';
  const unread=TICKETS.filter(t=>t.unread).length+2;
  return `<div class="ph-head">
    ${canBack?`<button class="iconbtn" data-a="back" aria-label="Quay lại">${ic('back',20)}</button>`:''}
    <h2>${k==='home'?`<span style="display:block;font-size:17px;color:var(--accent)">${WORDMARK}</span>`:esc(s.t)}</h2>
    <button class="iconbtn" data-a="go" data-v="notif" aria-label="Thông báo">${ic('bell',20)}<span class="dot">${unread}</span></button>
    <button class="iconbtn" data-a="go" data-v="profile" aria-label="Hồ sơ" style="padding:0">${avatar(P().name,30)}</button>
  </div>`;
}

const missing=t=>{const r=[];if(!t.cat)r.push('hạng mục');else{if((FIN_CAT[t.type][t.cat]||[]).length&&!t.sub)r.push('hạng mục liên quan');if(NEED_BR.includes(t.cat)&&!(t.br&&t.br.length))r.push('chi nhánh');}if(!t.amt)r.push('số tiền');return r;};
const share=(t,b)=>t.br===b?1:t.br==='Tất cả'?1/BR.length:Array.isArray(t.br)&&t.br.includes(b)?1/t.br.length:0;

function openBal(m){return m==='09/2026'?1245600000:monthStats('09/2026').close;}
function monthStats(m){const rows=TX.filter(t=>mon(t.d)===m);let thu=0,chi=0;const bal={};const open=openBal(m);let run=open;const pending=[];
  rows.forEach(t=>{if(missing(t).length){pending.push(t);return;}if(t.type==='THU'){thu+=t.amt;run+=t.amt;}else{chi+=t.amt;run-=t.amt;}bal[t.id]=run;});
  return {rows,thu,chi,open,close:open+thu-chi,bal,pending};}
function pnl(m){const rows=TX.filter(t=>mon(t.d)===m&&!missing(t).length);const br={};BR.forEach(b=>br[b]={rev:0,cost:{},direct:0,shared:0});let other=0,bod=0;const comp={};
  rows.forEach(t=>{
    if(t.type==='THU'){if(t.cat==='Doanh thu cửa hàng'||t.cat==='Nộp tiền mặt')BR.forEach(b=>{br[b].rev+=t.amt*share(t,b);});else if(t.cat!=='Vay')other+=t.amt;return;}
    if(t.cat==='Chi phí cho BOD'){bod+=t.amt;return;}
    if(t.cat==='Chi phí công ty'&&!(t.br&&t.br.length)){comp[t.sub]=(comp[t.sub]||0)+t.amt;return;}
    const key=t.cat==='Mặt bằng'?'Mặt bằng':t.sub;
    BR.forEach(b=>{const s=share(t,b);if(!s)return;br[b].cost[key]=(br[b].cost[key]||0)+t.amt*s;if(s<1)br[b].shared+=t.amt*s;else br[b].direct+=t.amt;});});
  BR.forEach(b=>{const x=br[b];x.total=Object.values(x.cost).reduce((a,c)=>a+c,0);x.profit=x.rev-x.total;});
  const rev=BR.reduce((a,b)=>a+br[b].rev,0),store=BR.reduce((a,b)=>a+br[b].total,0),company=Object.values(comp).reduce((a,c)=>a+c,0);
  const profit=rev+other-store-company-bod;return {br,rev,other,store,comp,company,bod,profit,pct:profit/(PROFIT_TARGET[m]||1e9)};}

let lastKey='';
function render(){
  const st=document.getElementById('stage');
  const key=S.mode+S.scr+S.arg+S.page;
  const sc=document.getElementById('scr');const top=sc&&key===lastKey?sc.scrollTop:0;
  const authed=S.auth.ok;document.querySelector('.seg').hidden=!authed;document.getElementById('who').hidden=!authed;document.getElementById('logout').hidden=!authed;
  if(!authed){st.innerHTML=loginPage();lastKey='gate';return;}
  document.getElementById('m-emp').setAttribute('aria-pressed',S.mode==='emp');
  document.getElementById('m-adm').setAttribute('aria-pressed',S.mode==='adm');
  document.getElementById('who').innerHTML=S.mode==='emp'
   ?`<label for="sel-p">Nhân viên mẫu</label><select id="sel-p" data-c="persona">${Object.entries(PERSONAS).map(([id,p])=>`<option value="${id}" ${S.p===id?'selected':''}>${esc(p.name)} · ${esc(titleOf(p))}</option>`).join('')}</select>`
   :`<label for="sel-r">Xem với vai</label><select id="sel-r" data-c="role">${Object.entries(ROLES).map(([id,l])=>`<option value="${id}" ${S.role===id?'selected':''}>${l}</option>`).join('')}</select>`;
  st.innerHTML=S.mode==='emp'?empView():admView();
  const sc2=document.getElementById('scr');if(sc2)sc2.scrollTop=top;
  if(key!==lastKey&&S.mode==='adm'&&window.scrollY>200)window.scrollTo({top:0});
  lastKey=key;
  setTopH();
  document.querySelectorAll('canvas[data-confetti]').forEach(confetti);
}
function confetti(cv){const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;const c=cv.getContext('2d');const cols=['#F7D464','#FFFFFF','#A5D8F0','#B4D78C'];let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
 for(let i=0;i<60;i++){c.save();c.translate(rnd()*r.width,rnd()*r.height);c.rotate(rnd()*6.28);c.fillStyle=cols[i%4];c.globalAlpha=.5+rnd()*.5;c.fillRect(-3,-1.5,6+rnd()*4,3);c.restore();}}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}

function go(v){const [scr,arg]=String(v).split('|');S.stack.push([S.scr,S.arg]);S.scr=scr;S.arg=arg??null;S.sheet=null;if(scr==='ticket'){const t=TICKETS.find(x=>x.id===arg);if(t)t.unread=false;}render();}
const ACT={
 mode:v=>{S.mode=v;render();window.scrollTo({top:0});},
 noop:()=>{},
 loginFill:v=>{S.auth.code=v;S.auth.pw='••••••••';S.auth.err='';render();},
 login:()=>{const a=S.auth,code=a.code.trim().toUpperCase(),u=ACC.find(x=>x.code===code);
  if(!u||!a.pw){a.err='Mã nhân viên hoặc mật khẩu không đúng.';render();return;}
  if(u.st==='locked'){a.err='Tài khoản '+code+' đã bị khoá. '+(u.lockNote||'')+' Liên hệ Admin nếu cần mở lại.';render();return;}
  a.ok=true;a.err='';a.user=code;
  if(u.st==='temp'){S.mode='emp';S.p=u.persona||'mai';S.stack=[];S.scr='consent';S.consent=false;}
  else if(u.roles.length){S.mode='adm';S.role=u.roles[0];S.page='overview';}
  else{S.mode='emp';S.p=u.persona||'bao';S.stack=[];S.scr='home';}

 accSt:v=>{S.acc.st=v;render();},

 accEdit:(v,el,e)=>{if(e.target.closest('button'))return;const u=ACC.find(x=>x.code===v);S.acc.edit={...u,roles:[...u.roles],orig:true};render();},

 pwClose:(v,el,e)=>{if(v!=='x'&&e.target.closest('.drawer'))return;S.acc.pw=null;render();},
 accRole:v=>{const r=S.acc.edit.roles,i=r.indexOf(v);i<0?r.push(v):r.splice(i,1);render();},
 accRegen:()=>{S.acc.edit.pw=genPw();render();},
 accSave:()=>{const e=S.acc.edit;
  if(!e.orig){const code=e.code.trim().toUpperCase();if(!/^FR\d{4}$/.test(code)){toast('Mã NV dạng FR + 4 số, theo iPOS');return;}if(ACC.some(x=>x.code===code)){toast('Mã '+code+' đã có tài khoản');return;}if(!e.name.trim()){toast('Nhập họ tên');return;}
   ACC.unshift({code,name:e.name.trim(),store:e.store,pos:e.pos||'Nhân viên',roles:e.roles,st:'temp',last:'',sent:'08/10/2026'});S.acc.edit=null;S.acc.pw={code,name:e.name.trim(),pw:e.pw,isNew:true};S.acc.st='all';render();return;}
  const u=ACC.find(x=>x.code===e.code);u.store=e.store;u.pos=e.pos;u.roles=e.roles;S.acc.edit=null;render();toast('Đã lưu tài khoản '+u.code);},
 accReset:v=>{const u=ACC.find(x=>x.code===v);u.st='temp';u.sent='08/10/2026';S.acc.edit=null;S.acc.pw={code:u.code,name:u.name,pw:genPw()};render();},
 accLock:v=>{const u=ACC.find(x=>x.code===v);if(u.st==='locked'){u.st=u.last?'active':'temp';u.lockNote='';toast('Đã mở khoá '+u.code);}else{u.st='locked';u.lockNote='Admin khoá 08/10/2026';toast('Đã khoá '+u.code+' và đăng xuất mọi phiên');}if(S.acc.edit)S.acc.edit={...u,roles:[...u.roles],orig:true};render();},
 go, jump:v=>{S.stack=v==='login'||v==='consent'?[]:[['home',null]];S.scr=v;S.arg=null;S.sheet=null;if(v==='newticket')S.newT.type='Góp ý';render();},

 hofTab:v=>{S.hofTab=v;render();},
 react:v=>{const [id,k]=v.split('|');MYREACT[id]=MYREACT[id]||{};MYREACT[id][k]=!MYREACT[id][k];render();},
 kbadge:v=>{S.kudosBadge=v;render();},
 kudosSend:()=>{const to=document.getElementById('k-to').value,msg=document.getElementById('k-msg').value.trim();if(!msg){toast('Viết vài chữ cảm ơn trước khi gửi');return;}KUDOS.unshift({from:P().name,to,badge:S.kudosBadge,msg,time:'Vừa xong'});render();toast('Đã gửi ghi nhận tới '+to);},
 sv:v=>{const [i,x]=v.split('|');S.survey[i]=+x;render();},
 svSend:()=>{S.surveyDone=true;render();toast('Đã gửi khảo sát ẩn danh');},
 copy:v=>{const done=()=>toast('Đã chép '+v);try{navigator.clipboard.writeText(v).then(done,()=>toast(v));}catch(e){toast(v);}},
 ntType:v=>{S.newT.type=v;render();},
 ntTo:v=>{S.newT.to=v;render();},
 ntSend:()=>{const n=S.newT;const id='PH-09'+(33+TICKETS.length);const tl=(document.getElementById('nt-t')||{}).value||(n.type==='Đơn từ'?document.getElementById('nt-f').value:n.type==='Báo hỏng'?document.getElementById('nt-m').value+' hỏng':'Báo thông tin sai: '+(S.wrongFrom||'Lương'));
   TICKETS.unshift({id,type:n.type==='Báo thông tin sai'?'Báo sai':n.type,to:n.type==='Báo hỏng'?'Bảo trì':n.type==='Góp ý'?n.to:'Admin',title:tl+(n.anon&&n.type==='Góp ý'?' (ẩn danh)':''),status:0,date:'26/09/2026',thread:[{me:true,who:n.anon&&n.type==='Góp ý'?'Bạn (ẩn danh)':'Bạn',t:(document.getElementById('nt-b')||document.getElementById('nt-p')).value,time:'26/09 09:41'}]});
   S.stack=[['support',null]];S.scr='ticket';S.arg=id;render();toast('Đã gửi phiếu '+id);},
 tkReply:v=>{const t=TICKETS.find(x=>x.id===v);const txt=document.getElementById('tk-reply').value.trim();if(!txt)return;t.thread.push({me:true,who:'Bạn',t:txt,time:'26/09 09:41'});t.status=Math.max(t.status,1);render();},
 tkDone:v=>{TICKETS.find(x=>x.id===v).status=3;render();toast('Phiếu đã đóng');},
 slAdd:()=>{const c=document.getElementById('sl-c').value,t=document.getElementById('sl-t').value.trim();if(!t)return;SHIFTLOG.unshift({date:'26/09/2026',shift:'Ca chiều',by:P().name,items:[[c,t]]});render();toast('Đã thêm vào sổ giao ca');},
 page:v=>{S.page=v;render();},
 wizType:v=>{S.wiz={type:v,step:1,published:false};render();},
 wiz:v=>{S.wiz.step=+v;render();},

 docOpen:v=>{S.docOpen=+v;render();},
 elig:v=>{S.elig[v]=true;render();toast('Đã đánh dấu. Lần upload file nhân viên kế tiếp sẽ cập nhật chức danh.');},
 hofLock:()=>{S.hofLocked=true;render();toast('Đã chốt Hall of Fame 2026');},
 selTicket:v=>{S.selTicket=v;render();},
 tkStatus:v=>{const [id,s]=v.split('|');ATICKETS.find(x=>x.id===id).status=+s;render();toast(s==='2'?'Đã gửi trả lời cho người gửi':'Đã đổi trạng thái');},
 selDevice:v=>{S.selDevice=v;render();},
 devFix:v=>{const d=DEVICES.find(x=>x.id===v);d.st='ok';d.h.unshift(['26/09/2026','Đã sửa xong, máy chạy bình thường']);render();toast('Đã cập nhật lịch sử máy');},
 setTab:v=>{S.settingsTab=v;render();},
 fdPost:()=>{const b=document.getElementById('fd-body').value.trim();if(!b)return;const id='p'+Date.now();POSTS.unshift({id,by:'Admin · '+document.getElementById('fd-to').value,time:'Vừa xong',body:b,kind:'post',r:{heart:0,cup:0},c:0});if(document.getElementById('fd-pin').checked)S.pinned[id]=true;render();toast('Đã đăng bài');},
 pinPost:v=>{S.pinned[v]=!S.pinned[v];render();},
 hidePost:v=>{S.hidden[v]=!S.hidden[v];render();},
finType:v=>{S.fin.type=v;render();},
 goMissing:v=>{S.fin.month=v;S.fin.type='missing';S.page='cash';render();},
 txNew:()=>{S.fin.edit={id:null,d:S.fin.month==='10/2026'?'2026-10-07':'2026-09-28',desc:'',type:'CHI',cat:'Chi phí cửa hàng',sub:'',br:S.fin.branch!=='all'?S.fin.branch:'',amt:'',refText:'',note:''};render();},
 txEdit:v=>{const t=TX.find(x=>x.id===+v);S.fin.edit={...t,br:Array.isArray(t.br)?[...t.br]:t.br,d:t.d.slice(6)+'-'+t.d.slice(3,5)+'-'+t.d.slice(0,2),refText:t.ref?'mail.google.com/mail/u/1/#search/… ('+t.ref+' chứng từ)':''};render();},
 txClose:(v,el,e)=>{if(v!=='x'&&e.target.closest('.drawer'))return;S.fin.edit=null;render();},
 txBr:v=>{const e=S.fin.edit;e.br=e.br.includes(v)?e.br.filter(x=>x!==v):[...e.br,v];render();},
 txSave:()=>{const e=S.fin.edit;const [y,mo,da]=(e.d||'2026-09-28').split('-');const rec={id:e.id||TXID++,d:`${da}/${mo}/${y}`,desc:(e.desc||'').trim()||'(chưa có diễn giải)',type:e.type,cat:e.cat,sub:e.sub,br:Array.isArray(e.br)&&!e.br.length?'':e.br,amt:+String(e.amt).replace(/\D/g,'')||0,ref:e.ref||(e.refText?1:0),note:e.note||''};
   if(S.fin.closed[mon(rec.d)]){toast('Tháng '+mon(rec.d)+' đã chốt sổ, không ghi thêm được');return;}
   const i=TX.findIndex(x=>x.id===rec.id);if(i>=0)TX[i]=rec;else TX.push(rec);TX.sort((a,b)=>dkey(a.d)-dkey(b.d)||a.id-b.id);
   if(['09/2026','10/2026'].includes(mon(rec.d)))S.fin.month=mon(rec.d);S.fin.edit=null;const ms=missing(rec);render();toast(ms.length?'Đã lưu. Còn thiếu '+ms.join(', ')+' nên chưa tính vào số dư':'Đã lưu giao dịch');},
 bankCheck:v=>{S.fin.bank[v]=+document.getElementById('bank-bal').value.replace(/\D/g,'');render();},
 bankFee:()=>{TX.push({id:TXID++,d:'30/09/2026',desc:'Phí dịch vụ ngân hàng tháng 09',type:'CHI',cat:'Chi phí công ty',sub:'Chi phí khác',br:'',amt:1250000,ref:1,note:'Theo sao kê ngân hàng'});TX.sort((a,b)=>dkey(a.d)-dkey(b.d)||a.id-b.id);render();toast('Đã ghi phí ngân hàng 1.250.000đ');},
 closeMonth:v=>{if(v==='10/2026'&&!S.fin.closed['09/2026']){toast('Chốt sổ tháng 09/2026 trước');return;}S.fin.closed[v]={by:S.role==='bgd'?'Lê Hoàng Anh (BGĐ)':'Nguyễn Thu Trang (Admin)',at:'08/10/2026 10:24'};render();toast('Đã chốt sổ tháng '+v);},
 reopen:v=>{delete S.fin.closed[v];render();toast('Đã mở lại sổ tháng '+v+'. Lần mở được ghi nhật ký.');},
 fsAdd:v=>{const el=document.getElementById('fs-'+v);const x=el.value.trim();if(!x)return;
   if(v==='THU'||v==='CHI')FIN_CAT[v][x]=[];else if(v==='CPCH')FIN_CAT.CHI['Chi phí cửa hàng'].push(x);else if(v==='CPCT')FIN_CAT.CHI['Chi phí công ty'].push(x);else if(v==='TTMB')FIN_CAT.THU['Thu tiền thuê mặt bằng'].push(x);else{toast('Thêm chi nhánh sẽ thêm cột mới trong P&L (demo)');return;}
   render();toast('Đã thêm '+x);},
 toast:v=>toast(v)
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='A'||el.tagName==='BUTTON')e.preventDefault();const f=ACT[el.dataset.a];if(f)f(el.dataset.v,el,e);});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;
 if(c==='finMonth'){S.fin.month=e.target.value.replace('Tháng ','');render();}
 if(c==='finBranch'){S.fin.branch=e.target.value;render();}
 if(c==='finCat'){S.fin.cat=e.target.value;render();}
 if(c==='closeMonth'){S.fin.closeMonth=e.target.value.replace('Tháng ','');render();}
 if(c==='pnlBr'){S.fin.pnlBr=e.target.value;render();}
 if(c==='txf'){const k=e.target.dataset.k,ed=S.fin.edit,v=e.target.value;if(k==='type'){ed.type=v;ed.cat='';ed.sub='';}else if(k==='cat'){ed.cat=v;ed.sub='';}else if(k==='br'){ed.br=v==='multi'?[]:v;}else ed[k]=v;render();}
 if(c==='accBr'){S.acc.br=e.target.value;render();}
 if(c==='accf'){S.acc.edit[e.target.dataset.k]=e.target.value;}
 if(c==='persona')ACT.persona(e.target.value);
 if(c==='role'){S.role=e.target.value;render();}
 if(c==='consent'){S.consent=e.target.checked;render();}
 if(c==='anon'){S.newT.anon=e.target.checked;}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.gate-form')){e.preventDefault();ACT.login();}});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;
 if(k==='login'){S.auth[e.target.dataset.k]=e.target.value;return;}
 if(k==='acc'){S.acc.q=e.target.value;document.getElementById('acc-body').innerHTML=accRows();return;}
 if(k==='accf'){S.acc.edit[e.target.dataset.k]=e.target.value;return;}
 if(k==='cash'){S.fin.q=e.target.value;document.getElementById('cash-body').innerHTML=cashRows();document.getElementById('cash-sum').innerHTML=cashSum();return;}
 if(k==='txf'){const kk=e.target.dataset.k;S.fin.edit[kk]=kk==='amt'?(+e.target.value.replace(/\D/g,'')||''):e.target.value;return;}const q=fold(e.target.value.trim());
 const list=document.getElementById(k==='docs'?'doc-list':'dir-list');const root=k==='docs'?list:document.getElementById('scr');let shown=0;
 root.querySelectorAll('[data-key]').forEach(el=>{const ok=!q||el.dataset.key.includes(q);el.hidden=!ok;if(ok&&list.contains(el))shown++;});
 const em=document.getElementById(k==='docs'?'doc-empty':'dir-empty');if(em)em.hidden=shown>0;});
function setTopH(){document.documentElement.style.setProperty('--toph',document.querySelector('.top').offsetHeight+'px');}
addEventListener('resize',setTopH);
render();
</script>
